<!DOCTYPE html>
<html>
<head>
    <title>Online Grocery Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #333;
            padding: 12px;
            text-align: center;
        }

        nav button {
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #222;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 20px auto;
        }

        .page {
            display: none;
        }

        .active {
            display: block;
        }

        /* LOGIN / SIGNUP */

        .auth-box {
            background: white;
            width: 350px;
            max-width: 90%;
            margin: 50px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
            text-align: center;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .auth-box button {
            width: 100%;
            margin-top: 10px;
        }

        .message {
            margin-top: 10px;
            font-weight: bold;
        }

        /* PRODUCTS */

        #search {
            padding: 12px;
            width: 95%;
            margin-bottom: 20px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        .product h3 {
            margin: 10px;
        }

        /* CART */

        #cart {
            background: white;
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
        }

        li {
            margin: 10px;
        }

        #coupon {
            padding: 10px;
            width: 200px;
        }

        /* ADMIN */

        .admin-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        .admin-box input {
            padding: 10px;
            margin: 5px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        .admin-product {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        @media(max-width:700px) {

            .products {
                grid-template-columns: 1fr;
            }

            .admin-box input {
                width: 100%;
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🛒 Online Grocery Store</h1>
    <p>Fresh groceries at your doorstep</p>
</header>


<!-- ================= AUTH SECTION ================= -->

<div id="authPage" class="page active">

    <div class="auth-box">

        <h2>🔐 Login</h2>

        <input
            type="text"
            id="loginUsername"
            placeholder="Enter username"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter password"
        >

        <button onclick="login()">
            Login
        </button>

        <p id="loginMessage" class="message"></p>

        <hr>

        <h3>Create Account</h3>

        <input
            type="text"
            id="signupUsername"
            placeholder="Create username"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Create password"
        >

        <button onclick="signup()">
            Signup
        </button>

        <p id="signupMessage" class="message"></p>

        <p>
            <b>Admin Login</b><br>
            Username: admin<br>
            Password: admin123
        </p>

    </div>

</div>


<!-- ================= USER MODULE ================= -->

<div id="userPage" class="page">

    <nav>
        <button onclick="showUser()">🏠 Home</button>
        <button onclick="logout()">Logout</button>
    </nav>

    <div class="container">

        <h2>👤 User Module</h2>

        <p id="welcomeUser"></p>

        <input
            type="text"
            id="search"
            placeholder="Search groceries..."
            onkeyup="searchProducts()"
        >

        <div id="products" class="products">
        </div>


        <!-- SHOPPING CART -->

        <div id="cart">

            <h2>🛒 Shopping Cart</h2>

            <ul id="cartItems"></ul>

            <h3>
                Total: ₹<span id="total">0</span>
            </h3>

            <input
                type="text"
                id="coupon"
                placeholder="Coupon: SAVE10"
            >

            <button onclick="applyDiscount()">
                Apply Discount
            </button>

            <p id="discount"></p>

            <button onclick="checkout()">
                Checkout
            </button>

        </div>

    </div>

</div>


<!-- ================= ADMIN MODULE ================= -->

<div id="adminPage" class="page">

    <nav>
        <button onclick="showAdmin()">⚙️ Admin Dashboard</button>
        <button onclick="logout()">Logout</button>
    </nav>

    <div class="container">

        <h2>⚙️ Admin Module</h2>

        <p>
            Admin can add and delete grocery products.
        </p>

        <div class="admin-box">

            <h3>➕ Add New Product</h3>

            <input
                type="text"
                id="productName"
                placeholder="Product Name"
            >

            <input
                type="number"
                id="productPrice"
                placeholder="Price"
            >

            <button onclick="addProduct()">
                Add Product
            </button>

            <p id="adminMessage"></p>

            <hr>

            <h3>📦 Manage Products</h3>

            <div id="adminProducts"></div>

        </div>

    </div>

</div>


<script>

    /* ==========================================
       DEFAULT PRODUCTS
    ========================================== */

    let defaultProducts = [

        { name: "🍎 Apples", price: 120 },
        { name: "🍌 Bananas", price: 60 },
        { name: "🥛 Milk", price: 50 },
        { name: "🍚 Rice", price: 70 },
        { name: "🥚 Eggs", price: 80 },
        { name: "🥔 Potatoes", price: 40 },
        { name: "🍅 Tomatoes", price: 50 },
        { name: "🥕 Carrots", price: 60 },
        { name: "🧅 Onions", price: 45 },
        { name: "🍞 Bread", price: 40 },
        { name: "🧀 Cheese", price: 150 },
        { name: "🍊 Oranges", price: 100 }

    ];


    /* ==========================================
       LOCAL STORAGE - PRODUCTS
    ========================================== */

    if (!localStorage.getItem("products")) {

        localStorage.setItem(
            "products",
            JSON.stringify(defaultProducts)
        );

    }


    /* ==========================================
       SIGNUP
    ========================================== */

    function signup() {

        let username =
            document.getElementById("signupUsername").value;

        let password =
            document.getElementById("signupPassword").value;


        if (username === "" || password === "") {

            document.getElementById("signupMessage")
                .innerText =
                "Please enter username and password.";

            return;
        }


        let users =
            JSON.parse(localStorage.getItem("users")) || [];


        let existingUser =
            users.find(function(user) {

                return user.username === username;

            });


        if (existingUser) {

            document.getElementById("signupMessage")
                .innerText =
                "Username already exists.";

            return;
        }


        users.push({

            username: username,
            password: password

        });


        localStorage.setItem(
            "users",
            JSON.stringify(users)
        );


        document.getElementById("signupMessage")
            .innerText =
            "Signup successful! You can now login.";

    }


    /* ==========================================
       LOGIN
    ========================================== */

    function login() {

        let username =
            document.getElementById("loginUsername").value;

        let password =
            document.getElementById("loginPassword").value;


        /* ADMIN LOGIN */

        if (
            username === "admin" &&
            password === "admin123"
        ) {

            showAdmin();

            return;
        }


        /* USER LOGIN */

        let users =
            JSON.parse(localStorage.getItem("users")) || [];


        let user =
            users.find(function(user) {

                return (
                    user.username === username &&
                    user.password === password
                );

            });


        if (user) {

            localStorage.setItem(
                "loggedInUser",
                username
            );

            document.getElementById("welcomeUser")
                .innerText =
                "Welcome, " + username + "!";

            showUser();

        }

        else {

            document.getElementById("loginMessage")
                .innerText =
                "Invalid username or password.";

        }

    }


    /* ==========================================
       PAGE NAVIGATION
    ========================================== */

    function hideAllPages() {

        document.getElementById("authPage")
            .classList.remove("active");

        document.getElementById("userPage")
            .classList.remove("active");

        document.getElementById("adminPage")
            .classList.remove("active");

    }


    function showUser() {

        hideAllPages();

        document.getElementById("userPage")
            .classList.add("active");

        displayProducts();

    }


    function showAdmin() {

        hideAllPages();

        document.getElementById("adminPage")
            .classList.add("active");

        displayAdminProducts();

    }


    /* ==========================================
       LOGOUT
    ========================================== */

    function logout() {

        localStorage.removeItem("loggedInUser");

        hideAllPages();

        document.getElementById("authPage")
            .classList.add("active");

        alert("Logged out successfully.");

    }


    /* ==========================================
       DISPLAY PRODUCTS FOR USER
    ========================================== */

    function displayProducts() {

        let products =
            JSON.parse(localStorage.getItem("products")) || [];

        let productContainer =
            document.getElementById("products");

        productContainer.innerHTML = "";


        products.forEach(function(product) {

            let div =
                document.createElement("div");

            div.className = "product";


            div.innerHTML = `

                <h3>${product.name}</h3>

                <p>₹${product.price}</p>

                <button onclick="addToCart(
                    '${product.name}',
                    ${product.price}
                )">

                    Add to Cart

                </button>

            `;


            productContainer.appendChild(div);

        });

    }


    /* ==========================================
       SHOPPING CART
    ========================================== */

    let cart = [];

    let total = 0;

    let discountApplied = false;


    function addToCart(name, price) {

        cart.push({

            name: name,
            price: price

        });


        total += price;

        displayCart();

    }


    function displayCart() {

        let list =
            document.getElementById("cartItems");

        list.innerHTML = "";


        cart.forEach(function(item, index) {

            let li =
                document.createElement("li");


            li.innerHTML =

                item.name +
                " - ₹" +
                item.price +
                " " +

                "<button onclick='removeItem(" +
                index +
                ")'>Remove</button>";


            list.appendChild(li);

        });


        document.getElementById("total")
            .innerText =
            total.toFixed(2);

    }


    function removeItem(index) {

        total -= cart[index].price;

        cart.splice(index, 1);

        displayCart();

    }


    /* ==========================================
       SEARCH
    ========================================== */

    function searchProducts() {

        let search =
            document.getElementById("search")
            .value
            .toLowerCase();


        let products =
            document.querySelectorAll(".product");


        products.forEach(function(product) {

            let name =
                product.innerText.toLowerCase();


            if (name.includes(search)) {

                product.style.display = "block";

            }

            else {

                product.style.display = "none";

            }

        });

    }


    /* ==========================================
       COUPON
    ========================================== */

    function applyDiscount() {

        let coupon =
            document.getElementById("coupon")
            .value
            .toUpperCase();


        if (
            coupon === "SAVE10" &&
            !discountApplied
        ) {

            total = total * 0.90;

            discountApplied = true;


            document.getElementById("discount")
                .innerText =
                "10% discount applied!";


            displayCart();

        }

        else if (discountApplied) {

            document.getElementById("discount")
                .innerText =
                "Discount already applied.";

        }

        else {

            document.getElementById("discount")
                .innerText =
                "Invalid coupon code.";

        }

    }


    /* ==========================================
       CHECKOUT
    ========================================== */

    function checkout() {

        if (cart.length === 0) {

            alert("Your cart is empty!");

            return;

        }


        alert(
            "Order placed successfully!\n" +
            "Total Amount: ₹" +
            total.toFixed(2)
        );


        cart = [];

        total = 0;

        discountApplied = false;


        document.getElementById("coupon")
            .value = "";

        document.getElementById("discount")
            .innerText = "";


        displayCart();

    }


    /* ==========================================
       ADMIN - ADD PRODUCT
    ========================================== */

    function addProduct() {

        let name =
            document.getElementById("productName")
            .value;

        let price =
            document.getElementById("productPrice")
            .value;


        if (name === "" || price === "") {

            document.getElementById("adminMessage")
                .innerText =
                "Please enter product name and price.";

            return;

        }


        let products =
            JSON.parse(localStorage.getItem("products")) || [];


        products.push({

            name: "🛒 " + name,

            price: Number(price)

        });


        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );


        document.getElementById("productName")
            .value = "";

        document.getElementById("productPrice")
            .value = "";


        document.getElementById("adminMessage")
            .innerText =
            "Product added successfully.";


        displayAdminProducts();

    }


    /* ==========================================
       ADMIN - DISPLAY PRODUCTS
    ========================================== */

    function displayAdminProducts() {

        let products =
            JSON.parse(localStorage.getItem("products")) || [];


        let container =
            document.getElementById("adminProducts");


        container.innerHTML = "";


        products.forEach(function(product, index) {

            let div =
                document.createElement("div");


            div.className = "admin-product";


            div.innerHTML = `

                <b>${product.name}</b>

                - ₹${product.price}

                <button onclick="deleteProduct(${index})">

                    Delete

                </button>

            `;


            container.appendChild(div);

        });

    }


    /* ==========================================
       ADMIN - DELETE PRODUCT
    ========================================== */

    function deleteProduct(index) {

        let products =
            JSON.parse(localStorage.getItem("products")) || [];


        products.splice(index, 1);


        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );


        displayAdminProducts();

    }

</script>

</body>
</html>
